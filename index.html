<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网络接口IP地址信息</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        .header p {
            font-size: 1rem;
            opacity: 0.9;
        }
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            overflow: hidden;
            margin-bottom: 20px;
        }
        .card-header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            padding: 16px 20px;
            color: white;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-header::before {
            content: '';
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
        }
        .card-body {
            padding: 20px;
        }
        .interface-item {
            border-bottom: 1px solid #eee;
            padding: 15px 0;
        }
        .interface-item:last-child {
            border-bottom: none;
        }
        .interface-name {
            font-weight: 600;
            color: #333;
            font-size: 1.1rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .interface-name::before {
            content: '📶';
        }
        .ipv6-list {
            margin-left: 24px;
        }
        .ipv6-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            background: #f8f9fa;
            border-radius: 6px;
            margin-bottom: 8px;
            gap: 12px;
        }
        .ipv6-item:last-child {
            margin-bottom: 0;
        }
        .ipv6-address {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.95rem;
            color: #2c3e50;
            word-break: break-all;
            flex: 1;
        }
        .ipv6-type {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 500;
            white-space: nowrap;
        }
        .type-global {
            background: #d4edda;
            color: #155724;
        }
        .type-link-local {
            background: #fff3cd;
            color: #856404;
        }
        .type-loopback {
            background: #cce5ff;
            color: #004085;
        }
        .type-unique-local {
            background: #d1ecf1;
            color: #0c5460;
        }
        .type-documentation {
            background: #f3e8ff;
            color: #553c9a;
        }
        .type-unknown {
            background: #f8d7da;
            color: #721c24;
        }
        .ipv6-more {
            margin: 4px 0 8px 24px;
        }
        .ipv6-more summary {
            cursor: pointer;
            color: #667eea;
            font-size: 0.8rem;
            user-select: none;
            width: fit-content;
        }
        .ipv6-more summary:hover {
            text-decoration: underline;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        .empty-state h3 {
            margin-bottom: 10px;
            color: #444;
        }
        .footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            opacity: 0.8;
            font-size: 0.9rem;
        }
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            .header h1 {
                font-size: 1.5rem;
            }
            .card-body {
                padding: 15px;
            }
            .ipv6-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 网络接口IP地址信息</h1>
            <p>显示本机所有网络接口的IP地址配置 · <a href="lan.php" style="color: inherit; border-bottom: 1px dashed rgba(255,255,255,0.6); text-decoration: none;">扫描局域网设备 →</a></p>
        </div>
        
        <div class="card">
            <div class="card-header">IP地址列表</div>
            <div class="card-body">
                {{CONTENT}}
            </div>
        </div>
        
        <div class="footer">
            <p>检测时间: {{TIMESTAMP}}</p>
        </div>
    </div>
</body>
</html>
