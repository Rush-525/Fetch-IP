<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>局域网设备扫描</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/lan.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌐 局域网设备扫描</h1>
            <p>发现局域网中其他设备的IPv4/IPv6地址（扫描约需15秒，请耐心等待）</p>
        </div>

        <div class="toolbar">
            <button class="refresh-btn" id="rescan-btn" onclick="runScan()">🔄 重新扫描</button>
            <label class="ipv6-toggle" title="开启后将同时通过多播发现与邻居缓存扫描设备的IPv6地址">
                <input type="checkbox" id="ipv6-toggle">
                <span>扫描IPv6</span>
            </label>
            <a class="nav-link" href="index.php">查看本机IP →</a>
        </div>

        <div class="card">
            <div class="card-header">发现的设备</div>
            <div class="card-body">
                <div id="scan-loading" class="scan-loading">
                    <div class="spinner"></div>
                    <p>正在扫描局域网，请稍候…</p>
                    <p class="scan-step" id="scan-step">正在准备扫描…</p>
                </div>
                <div id="scan-result" style="display:none">
                    {{CONTENT}}
                </div>
            </div>
        </div>

        <div id="ipv6-summary">{{IPV6_SUMMARY}}</div>

        <div class="footer">
            <p>扫描时间: <span id="scan-time">{{TIMESTAMP}}</span> · 扫描方式: Ping探测 + ARP表/IPv6邻居缓存 + 反向DNS</p>
        </div>
    </div>

    <script>
        const IPV6_SCAN_KEY = 'lan_scan_ipv6';
        const ipv6Box = document.getElementById('ipv6-toggle');

        // 从 localStorage 恢复 IPv6 扫描开关状态（默认不启用，勾选过一次后记忆）
        ipv6Box.checked = localStorage.getItem(IPV6_SCAN_KEY) === '1';
        // 切换开关后保存偏好并按新设置立即重新扫描
        ipv6Box.addEventListener('change', () => {
            localStorage.setItem(IPV6_SCAN_KEY, ipv6Box.checked ? '1' : '0');
            runScan();
        });

        // 底部 IPv6 汇总面板：候选地址展示开关（localStorage 记忆；事件委托适配动态注入的面板内容）
        const ipv6SummaryBox = document.getElementById('ipv6-summary');
        const CANDIDATE_KEY = 'lan_show_ipv6_candidates';
        ipv6SummaryBox.addEventListener('change', (e) => {
            if (e.target && e.target.id === 'candidate-toggle') {
                localStorage.setItem(CANDIDATE_KEY, e.target.checked ? '1' : '0');
                applyCandidateVisibility();
            }
        });
        // 按记忆的偏好显示/隐藏候选地址行，并同步选项框勾选状态
        function applyCandidateVisibility() {
            const panel = ipv6SummaryBox.querySelector('.ipv6-summary');
            if (!panel) return;
            const show = localStorage.getItem(CANDIDATE_KEY) !== '0';
            const box = panel.querySelector('#candidate-toggle');
            if (box) {
                box.checked = show;
            }
            panel.classList.toggle('hide-candidates', !show);
        }

        // 离开页面时（关闭标签页/跳转/刷新）通知服务端删除本次扫描生成的缓存文件
        window.addEventListener('pagehide', () => {
            navigator.sendBeacon('lan.php?cleanup=1');
        });

        // 扫描进度轮询：读取服务端当前执行的具体步骤，更新加载动画下的小字
        let pollTimer = null;
        function pollProgress(scanId) {
            fetch('lan.php?progress=' + scanId + '&_t=' + Date.now(), { cache: 'no-store' })
                .then(r => r.ok ? r.json() : null)
                .then(d => {
                    if (d && d.step) {
                        document.getElementById('scan-step').textContent = d.step;
                    }
                })
                .catch(() => {});
        }

        let scanning = false;
        async function runScan() {
            if (scanning) return;
            scanning = true;
            const btn = document.getElementById('rescan-btn');
            const loading = document.getElementById('scan-loading');
            const result = document.getElementById('scan-result');
            const stepText = document.getElementById('scan-step');
            const v6Summary = document.getElementById('ipv6-summary');
            btn.disabled = true;
            loading.style.display = 'block';
            result.style.display = 'none';
            v6Summary.style.display = 'none';
            stepText.textContent = '正在准备扫描…';

            // 本次扫描标识：服务端据此写进度文件，前端轮询展示执行步骤
            const scanId = Date.now().toString();
            pollTimer = setInterval(() => pollProgress(scanId), 500);

            try {
                const resp = await fetch('lan.php?ajax=1&ipv6=' + (ipv6Box.checked ? '1' : '0') + '&scan=' + scanId + '&_t=' + Date.now(), { cache: 'no-store' });
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const data = await resp.json();
                result.innerHTML = data.content;
                v6Summary.innerHTML = data.ipv6Summary;
                applyCandidateVisibility();
                v6Summary.style.display = data.ipv6Summary ? 'block' : 'none';
                document.getElementById('scan-time').textContent = data.timestamp;
                loading.style.display = 'none';
                result.style.display = 'block';
            } catch (e) {
                loading.style.display = 'none';
                result.style.display = 'block';
                result.innerHTML = '<div class="scan-error">⚠️ 扫描失败，请点击"重新扫描"重试</div>';
            } finally {
                clearInterval(pollTimer);
                scanning = false;
                btn.disabled = false;
            }
        }
        runScan();
    </script>
</body>
</html>
