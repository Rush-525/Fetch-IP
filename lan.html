<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>局域网设备扫描</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        .header p {
            font-size: 1rem;
            opacity: 0.9;
        }
        .toolbar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }
        .refresh-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.5);
            color: white;
            padding: 10px 24px;
            border-radius: 24px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .refresh-btn:hover {
            background: rgba(255,255,255,0.35);
        }
        .nav-link {
            color: white;
            text-decoration: none;
            font-size: 0.95rem;
            opacity: 0.9;
            border-bottom: 1px dashed rgba(255,255,255,0.6);
            padding-bottom: 2px;
        }
        .nav-link:hover {
            opacity: 1;
        }
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            overflow: hidden;
            margin-bottom: 20px;
        }
        .card-header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            padding: 16px 20px;
            color: white;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-header::before {
            content: '';
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
        }
        .card-body {
            padding: 20px;
        }
        .subnet-section {
            margin-bottom: 25px;
        }
        .subnet-section:last-child {
            margin-bottom: 0;
        }
        .subnet-title {
            font-weight: 600;
            color: #333;
            font-size: 1.05rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .subnet-meta {
            font-size: 0.8rem;
            font-weight: 400;
            color: #888;
        }
        .device-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }
        .device-table th {
            text-align: left;
            color: #888;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            padding: 8px 12px;
            border-bottom: 2px solid #e8e8e8;
            white-space: nowrap;
        }
        .device-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #f0f0f0;
            color: #2c3e50;
            vertical-align: middle;
        }
        .device-table tr:last-child td {
            border-bottom: none;
        }
        .device-table tr:hover td {
            background: #f8f9fa;
        }
        .ip-cell, .mac-cell {
            font-family: 'Consolas', 'Monaco', monospace;
            white-space: nowrap;
        }
        .ipv6-cell {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.85rem;
            min-width: 220px;
        }
        .ipv6-line {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 2px 0;
        }
        .ipv6-addr-text {
            color: #2c3e50;
            word-break: break-all;
        }
        .v6tag {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 0.68rem;
            padding: 1px 8px;
            border-radius: 10px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .v6-global {
            background: #d4edda;
            color: #155724;
        }
        .v6-unique-local {
            background: #d1ecf1;
            color: #0c5460;
        }
        .v6-link-local {
            background: #fff3cd;
            color: #856404;
        }
        .v6-other {
            background: #f8d7da;
            color: #721c24;
        }
        .hostname-cell {
            word-break: break-all;
        }
        .badge {
            font-size: 0.72rem;
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: 500;
            white-space: nowrap;
        }
        .badge-dynamic {
            background: #d4edda;
            color: #155724;
        }
        .badge-static {
            background: #cce5ff;
            color: #004085;
        }
        .badge-other {
            background: #f8d7da;
            color: #721c24;
        }
        .empty-subnet {
            text-align: center;
            padding: 24px;
            color: #999;
            font-size: 0.9rem;
        }
        .summary-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f0f6ff;
            border-radius: 8px;
            padding: 12px 18px;
            margin-bottom: 20px;
            color: #2c5282;
            font-size: 0.9rem;
            flex-wrap: wrap;
            gap: 8px;
        }
        .summary-bar strong {
            font-size: 1.3rem;
        }
        .scan-loading {
            text-align: center;
            padding: 40px 20px;
        }
        .spinner {
            width: 44px;
            height: 44px;
            margin: 0 auto 16px;
            border: 4px solid rgba(102, 126, 234, 0.2);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .scan-loading p {
            color: #666;
            font-size: 0.95rem;
        }
        .scan-loading .scan-step {
            font-size: 0.8rem;
            color: #aaa;
            margin-top: 6px;
        }
        .scan-error {
            text-align: center;
            padding: 24px;
            color: #c0392b;
            font-size: 0.95rem;
        }
        .refresh-btn:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }
        .debug-item {
            padding: 5px 0;
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }
        .debug-item span:first-child {
            color: #666;
        }
        .debug-item span:last-child {
            font-weight: bold;
            color: #333;
            word-break: break-all;
            text-align: right;
        }
        .footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            opacity: 0.8;
            font-size: 0.9rem;
        }
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            .header h1 {
                font-size: 1.5rem;
            }
            .card-body {
                padding: 15px;
                overflow-x: auto;
            }
            .toolbar {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌐 局域网设备扫描</h1>
            <p>发现局域网中其他设备的IPv4/IPv6地址（扫描约需15秒，请耐心等待）</p>
        </div>

        <div class="toolbar">
            <button class="refresh-btn" id="rescan-btn" onclick="runScan()">🔄 重新扫描</button>
            <a class="nav-link" href="index.php">查看本机IP →</a>
        </div>

        <div class="card">
            <div class="card-header">发现的设备</div>
            <div class="card-body">
                <div id="scan-loading" class="scan-loading">
                    <div class="spinner"></div>
                    <p>正在扫描局域网，请稍候…</p>
                    <p class="scan-step">Ping探测 + ARP表/IPv6邻居缓存 + 反向DNS，约需15秒</p>
                </div>
                <div id="scan-result" style="display:none">
                    {{CONTENT}}
                </div>
            </div>
        </div>

        <div class="footer">
            <p>扫描时间: <span id="scan-time">{{TIMESTAMP}}</span> · 扫描方式: Ping探测 + ARP表/IPv6邻居缓存 + 反向DNS</p>
        </div>
    </div>

    <script>
        let scanning = false;
        async function runScan() {
            if (scanning) return;
            scanning = true;
            const btn = document.getElementById('rescan-btn');
            const loading = document.getElementById('scan-loading');
            const result = document.getElementById('scan-result');
            btn.disabled = true;
            loading.style.display = 'block';
            result.style.display = 'none';

            try {
                const resp = await fetch('lan.php?ajax=1&_t=' + Date.now(), { cache: 'no-store' });
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const data = await resp.json();
                result.innerHTML = data.content;
                document.getElementById('scan-time').textContent = data.timestamp;
                loading.style.display = 'none';
                result.style.display = 'block';
            } catch (e) {
                loading.style.display = 'none';
                result.style.display = 'block';
                result.innerHTML = '<div class="scan-error">⚠️ 扫描失败，请点击"重新扫描"重试</div>';
            } finally {
                scanning = false;
                btn.disabled = false;
            }
        }
        runScan();
    </script>
</body>
</html>
